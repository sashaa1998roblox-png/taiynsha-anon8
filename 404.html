<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a12">
<meta name="robots" content="noindex">
<title>404 — Страница не найдена · Тайынша Анонимно</title>
<style>
:root{--soft:#c2b2ff;--bg:#0d0d14;--panel:#151520;--panel2:#1b1b29;--line:#29293a;--text:#f4f3fa;--muted:#9999ad;--accent:#9b7cff;--accent2:#6d56d9;--good:#65d6a4;--danger:#ff7185;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 12% 0%,#32225b55,transparent 34%),radial-gradient(ellipse at 90% 20%,#222d5550,transparent 28%),var(--bg);color:var(--text);font:15px/1.55 Inter,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}
a{color:inherit}

header{background:#0d0d14d9;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}
.top{max-width:1160px;margin:auto;padding:0 22px;height:76px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,white),#6d56d9);display:grid;place-items:center;font-size:21px;box-shadow:0 7px 25px color-mix(in srgb,var(--accent2) 35%,transparent)}
.brand strong{font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}

main{flex:1;display:grid;place-items:center;padding:40px 22px;position:relative}
.card{position:relative;width:100%;max-width:640px;text-align:center;padding:48px 32px 40px;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(145deg,#252039,#171724 65%);box-shadow:var(--shadow);overflow:hidden;animation:rise .6s ease both}
.card:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);filter:blur(5px);right:-70px;top:-90px;pointer-events:none}
.card:before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:#5f7bff18;filter:blur(8px);left:-80px;bottom:-90px;pointer-events:none}
.card>*{position:relative;z-index:1}

.eyebrow{display:inline-flex;gap:8px;align-items:center;color:#ffa3b1;background:#ff718518;border:1px solid #ff718535;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700}
.dot{width:7px;height:7px;background:var(--danger);border-radius:50%;box-shadow:0 0 12px var(--danger);animation:pulse 1.6s infinite}

.code{font-size:clamp(92px,22vw,168px);line-height:1;font-weight:900;letter-spacing:-8px;margin:22px 0 4px;display:flex;justify-content:center;align-items:center;gap:2px;user-select:none}
.code span{background:linear-gradient(100deg,#fff,var(--soft) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.code .zero{animation:float 3.2s ease-in-out infinite}
.code .zero:nth-child(3){animation-delay:.4s}
.code .mid{position:relative;width:.62em;height:.62em;margin:0 .04em;border-radius:50%;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,white),#6d56d9);box-shadow:0 10px 40px color-mix(in srgb,var(--accent2) 40%,transparent);display:grid;place-items:center;font-size:inherit;animation:float 3.2s ease-in-out infinite .2s;color:#fff}
.code .mid i{font-style:normal;font-size:.34em;letter-spacing:0;font-weight:800}

h1{font-size:clamp(24px,4.4vw,32px);line-height:1.15;letter-spacing:-.8px;margin:8px 0 12px}
.lead{color:var(--muted);max-width:460px;margin:0 auto 8px}
.path{display:inline-block;max-width:100%;margin:10px auto 0;padding:6px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--soft);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.btn{border:0;border-radius:12px;padding:12px 18px;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700;box-shadow:0 7px 22px color-mix(in srgb,var(--accent2) 25%,transparent);transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.secondary{background:var(--panel2);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn:focus-visible{outline:2px solid var(--soft);outline-offset:3px}

.hint{margin-top:26px;padding-top:18px;border-top:1px solid #ffffff10;color:var(--muted);font-size:12px}
.hint kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--text)}

.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stars b{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--soft);opacity:.35;animation:twinkle 4s ease-in-out infinite}

footer{text-align:center;color:var(--muted);font-size:12px;padding:0 22px 26px}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.6;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){.card{padding:36px 20px 30px;border-radius:22px}.code{letter-spacing:-4px}.actions .btn{flex:1 1 100%;justify-content:center}.brand small{display:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="brand" id="brandLink" href="/"><span class="logo">◈</span><span><strong>ТАЙЫНША АНОНИМНО</strong><small>Городская анонимная лента</small></span></a>
  </div>
</header>

<main>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <section class="card" role="alert" aria-live="polite">
    <span class="eyebrow"><span class="dot"></span>Ошибка 404</span>
    <div class="code" aria-hidden="true">
      <span class="zero">4</span><span class="mid"><i>?</i></span><span class="zero">4</span>
    </div>
    <h1>Такой страницы нет</h1>
    <p class="lead">Возможно, ссылка устарела, была набрана с ошибкой или страница удалена. Ничего страшного — вернёмся в ленту.</p>
    <div class="path" id="pathBox" title="Запрошенный адрес">/</div>

    <div class="actions">
      <a class="btn" id="homeBtn" href="/">← На главную</a>
      <button class="btn secondary" type="button" id="backBtn">Назад</button>
      <button class="btn secondary" type="button" id="reloadBtn">Обновить</button>
    </div>

    <div class="hint">Если ошибка повторяется — очистите кэш браузера или нажмите <kbd>Ctrl</kbd> + <kbd>F5</kbd></div>
  </section>
</main>

<footer>© Тайынша Анонимно</footer>

<script>
(function(){
  'use strict';
  // Цветовая тема сайта (та же, что выбрана в настройках)
  try {
    var t = (JSON.parse(localStorage.getItem('taiynsha_site_settings') || '{}') || {}).theme;
    var T = {
      green:{a:'#34d399',b:'#059669',s:'#a7f3d0'},
      blue:{a:'#38bdf8',b:'#2563eb',s:'#bae6fd'},
      rose:{a:'#fb7185',b:'#be185d',s:'#fecdd3'}
    }[t];
    if (T) { var r = document.documentElement.style; r.setProperty('--accent',T.a); r.setProperty('--accent2',T.b); r.setProperty('--soft',T.s); }
  } catch (e) {}


  // На Netlify главная — "/", при открытии файла прямо с компьютера (file://) — index.html
  var isLocal = location.protocol === 'file:';
  var homeUrl = isLocal ? 'index.html' : '/';
  document.getElementById('homeBtn').setAttribute('href', homeUrl);
  document.getElementById('brandLink').setAttribute('href', homeUrl);

  // Показываем, какой адрес не найден
  var params = new URLSearchParams(location.search);
  var shown = params.get('from');
  if (!shown) {
    var p = location.pathname;
    shown = /(^|\/)404\.html$/i.test(p) ? '(страница открыта напрямую)' : p + location.search;
  }
  try { shown = decodeURIComponent(shown); } catch (e) {}
  var box = document.getElementById('pathBox');
  box.textContent = shown;
  box.title = shown;

  // Кнопки
  document.getElementById('backBtn').addEventListener('click', function(){
    if (history.length > 1) history.back(); else location.href = homeUrl;
  });
  document.getElementById('reloadBtn').addEventListener('click', function(){ location.reload(); });

  // Горячая клавиша: Enter — на главную
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && document.activeElement === document.body) location.href = homeUrl;
  });

  // Мерцающие "звёзды" на фоне
  var st = document.getElementById('stars');
  for (var i = 0; i < 26; i++) {
    var s = document.createElement('b');
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    st.appendChild(s);
  }
})();
</script>
</body>
</html>
